		<script>
			AFRAME.registerComponent('spawn-in-circle', {
  				schema: {
    					radius: {type: 'number', default: 1}
  				},

  				init: function() {
    					var el = this.el;
    					var center = el.getAttribute('position');

					//Randomly positions object in circle
    					var angleRad = this.getRandomAngleInRadians();
    					var circlePoint = this.randomPointOnCircle(this.data.radius, angleRad);
					var worldPoint = {x: circlePoint.x + center.x, y: center.y, z: circlePoint.y + center.z};
					el.setAttribute('position', worldPoint);
					
					//Randomly rotates object
//    					var angleDeg = angleRad * 180 / Math.PI;
//    					var angleToCenter = -1 * angleDeg + 90;
//    					angleRad = THREE.MathUtils.degToRad(angleToCenter);
//    					el.object3D.rotation.set(0, angleRad, 0);
  				},

				getRandomAngleInRadians: function() {
    					return Math.random() * Math.PI * 2;
  				},

				randomPointOnCircle: function (radius, angleRad) {
    					var x = Math.cos(angleRad) * radius;
	    				var y = Math.sin(angleRad) * radius;
    					return {x: x, y: y};
  				}
			});
		</script>
		<script>
  			AFRAME.registerComponent('arrow-wasd-controls', {
    				schema: {
      					moveSpeed: {type: 'number', default: 0.1},
      					turnSpeed: {type: 'number', default: 2.0}
    				},
    				init: function () {
      					this.keys = {};
      					window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
      					window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    				},
    				tick: function (time, delta) {
      					const rot = this.el.getAttribute('rotation');
      					const pos = this.el.getAttribute('position');
      					const dt = delta / 1000;

      					// Turn using Q and E (WASD rotation)
      					if (this.keys['KeyQ']) rot.y += this.data.turnSpeed * dt * 45;
      					if (this.keys['KeyE']) rot.y -= this.data.turnSpeed * dt * 45;

      					// Calculate direction vectors based on current rotation
      					const rad = THREE.MathUtils.degToRad(rot.y);
      					const moveStep = this.data.moveSpeed * (delta / 16.6);

      					// Move using WASD Keys
      					if (this.keys['KeyW']) {
        					pos.x -= Math.sin(rad) * moveStep;
        					pos.z -= Math.cos(rad) * moveStep;
      					}
      					if (this.keys['KeyS']) {
        					pos.x += Math.sin(rad) * moveStep;
        					pos.z += Math.cos(rad) * moveStep;
      					}
      					if (this.keys['KeyA']) {
        					pos.x -= Math.cos(rad) * moveStep;
        					pos.z += Math.sin(rad) * moveStep;
      					}
      					if (this.keys['KeyD']) {
        					pos.x += Math.cos(rad) * moveStep;
        					pos.z -= Math.sin(rad) * moveStep;
      					}
					

					//Flight using SHIFT
					if (this.keys['ShiftLeft']){
						pos.y += moveStep;
					}
					if (this.keys['KeyR']){
						pos.y -= moveStep;
					}

      					this.el.setAttribute('rotation', rot);
      					this.el.setAttribute('position', pos);
    				}
  			});
		</script>
		<script>
			const selectedBoxes = new Set();

			AFRAME.registerComponent('multi-select-move', {
  				schema: {
    					activeColor: {default: '#333333'},
    					step: {default: 0.02}
  				},

  				init: function () {
    					const el = this.el;
    					const sceneEl = el.sceneEl;

    					const originalColor = el.getAttribute('color');
					const playerColor = document.querySelector('#player').getAttribute('player-color');

    					const raycaster = new THREE.Raycaster();
    					const mouse = new THREE.Vector2();
					

    					function updateMouse(event) {
      						const rect = sceneEl.canvas.getBoundingClientRect();
      						mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      						mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    					}

    					// Click / Shift‑Click selection
    					window.addEventListener('mousedown', (event) => {
      						updateMouse(event);
      						raycaster.setFromCamera(mouse, sceneEl.camera);

      						const intersects = raycaster.intersectObject(el.object3D, true);

      						if (intersects.length > 0) {
        						if (event.shiftKey) {
          							if (selectedBoxes.has(el)) {
            								selectedBoxes.delete(el);
            								el.setAttribute('color', originalColor);
          							} else {
            								selectedBoxes.add(el);
            								el.setAttribute('color', this.data.activeColor);
          							}
        						} else {
          							if (selectedBoxes.has(el)) {
            								selectedBoxes.delete(el);
            								el.setAttribute('color', originalColor);
          							} else {
            								selectedBoxes.add(el);
            								el.setAttribute('color', this.data.activeColor);
          							}
        						}
      						}
    					});

    					// TRUE CAMERA‑RELATIVE GRID MOVEMENT (FINAL FIX)
    					window.addEventListener('keydown', (event) => {
      						if (selectedBoxes.size === 0) return;

      						const step = this.data.step;

      						// Get camera direction vectors
      						const camObj = sceneEl.camera.el.object3D;

      						const forward = new THREE.Vector3();
      						camObj.getWorldDirection(forward);
      						forward.y = 0;                 // flatten
      						forward.normalize();

      						const right = new THREE.Vector3();
      						right.crossVectors(forward, new THREE.Vector3(0, 1, 0));
      						right.normalize();

      						// Snap forward/right to nearest axis (no diagonals)
      						function snapAxis(v) {
        						if (Math.abs(v.x) > Math.abs(v.z)) {
          							return new THREE.Vector3(Math.sign(v.x), 0, 0);
        						} else {
          							return new THREE.Vector3(0, 0, Math.sign(v.z));
        						}
      						}

      						const f = snapAxis(forward);
      						const r = snapAxis(right);

      						selectedBoxes.forEach(box => {
        						const pos = box.getAttribute('position');
        						let p = new THREE.Vector3(pos.x, pos.y, pos.z);

        						switch (event.key) {
          							case 'i': case 'I': p.addScaledVector(f, -step); break;
          							case 'k': case 'K': p.addScaledVector(f, step); break;
          							case 'j': case 'J': p.addScaledVector(r, step); break;
          							case 'l': case 'L': p.addScaledVector(r, -step); break;

          							case 'u': case 'U': p.y += step; break;
          							case 'o': case 'O': p.y -= step; break;
        						}

       							// Snap to 0.02 grid
       							p.x = Math.round(p.x / step) * step;
        						p.y = Math.round(p.y / step) * step;
        						p.z = Math.round(p.z / step) * step;

        						box.setAttribute('position', p);
      						});
    					});
  				}
			});
		</script>
		<script>
  			// Uses the same selectedBoxes Set you already have
  			const moveKeys = {};
  			let moveTimer = null;

  			function movementStep() {
    				const step = 0.02; // same as your schema default
    				if (selectedBoxes.size === 0) return;

    				const sceneEl = document.querySelector('a-scene');
    				if (!sceneEl || !sceneEl.camera) return;

    				const camObj = sceneEl.camera.el.object3D;

    				const forward = new THREE.Vector3();
    				camObj.getWorldDirection(forward);
    				forward.y = 0;
    				forward.normalize();

    				const right = new THREE.Vector3();
    				right.crossVectors(forward, new THREE.Vector3(0, 1, 0));
    				right.normalize();

    				function snapAxis(v) {
      					if (Math.abs(v.x) > Math.abs(v.z)) {
        					return new THREE.Vector3(Math.sign(v.x), 0, 0);
      					} else {
        					return new THREE.Vector3(0, 0, Math.sign(v.z));
      					}
    				}

    				const f = snapAxis(forward);
    				const r = snapAxis(right);

    				selectedBoxes.forEach(box => {
      					const pos = box.getAttribute('position');
      					let p = new THREE.Vector3(pos.x, pos.y, pos.z);

      					if (moveKeys['i']) p.addScaledVector(f, -step);
      					if (moveKeys['k']) p.addScaledVector(f, step);
      					if (moveKeys['j']) p.addScaledVector(r, step);
      					if (moveKeys['l']) p.addScaledVector(r, -step);

      					if (moveKeys['u']) p.y += step;
      					if (moveKeys['o']) p.y -= step;

      					// Snap to your 0.02 grid
      					p.x = Math.round(p.x / step) * step;
      					p.y = Math.round(p.y / step) * step;
      					p.z = Math.round(p.z / step) * step;

      					box.setAttribute('position', p);
    				});
  			}

  			window.addEventListener('keydown', (event) => {
    				const k = event.key.toLowerCase();
    				if (!['i','j','k','l','u','o'].includes(k)) return;

    				moveKeys[k] = true;

    				// Start repeating movement if not already running
    				if (!moveTimer) {
      					moveTimer = setInterval(movementStep, 50); // 20 steps per second, not animation
    				}
  			});

  			window.addEventListener('keyup', (event) => {
    				const k = event.key.toLowerCase();
    				if (!['i','j','k','l','u','o'].includes(k)) return;

    				moveKeys[k] = false;

    				// Stop repeating when no movement keys are held
    				if (!Object.values(moveKeys).some(Boolean)) {
      					clearInterval(moveTimer);
      					moveTimer = null;
    				}
  			});
		</script>
